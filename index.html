<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BEST SLITHER.IO Mod Menu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* --- YOUR ORIGINAL WEBSITE CSS - UNTOUCHED --- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #000 !important; color: #cfe8ff; overflow: hidden; }
    .frame { position: absolute; inset: 30px; border-radius: 18px; border: 1px solid rgba(0, 180, 255, 0.4); box-shadow: 0 0 25px rgba(0, 180, 255, 0.35), inset 0 0 25px rgba(0, 60, 120, 0.6); background: transparent !important; overflow: hidden; }
    #particles { position: absolute; inset: 0; width: 100%; height: 100%; background: transparent !important; z-index: 0; }
    .content { position: relative; z-index: 2; width: 100%; height: 100%; padding: 40px 60px; display: flex; flex-direction: column; justify-content: space-between; }
    .hud-top { display: flex; justify-content: space-between; font-size: 13px; color: #7fb7ff; text-transform: uppercase; letter-spacing: 2px; }
    .hud-pill { padding: 6px 14px; border-radius: 999px; border: 1px solid rgba(0, 180, 255, 0.5); background: rgba(0, 80, 140, 0.4); box-shadow: 0 0 12px rgba(0, 180, 255, 0.5); }
    .center { max-width: 720px; margin-top: 40px; }
    .logo-main { font-size: 32px; letter-spacing: 4px; text-transform: uppercase; color: #8fd4ff; margin-bottom: 10px; text-shadow: 0 0 12px #00e1ff, 0 0 30px #0077ff; }
    .headline { font-size: 26px; margin-bottom: 10px; color: #e5f3ff; }
    .typewriter { font-size: 16px; color: #9acbff; min-height: 24px; margin-bottom: 24px; text-shadow: 0 0 8px rgba(0, 200, 255, 0.6); }
    .desc { font-size: 14px; color: #7fa7d4; max-width: 520px; line-height: 1.6; margin-bottom: 26px; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 20px; }
    .btn-primary, .btn-secondary { padding: 12px 26px; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; border-radius: 999px; border: 1px solid #00c8ff; background: #003b66; color: #e5f7ff; box-shadow: 0 0 18px #00c8ff; cursor: pointer; }
    .btn-secondary { border-color: #4fa0ff; box-shadow: 0 0 12px #4fa0ff; opacity: 0.9; }
    .trail-dot { position: fixed; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; background: radial-gradient(circle, #00ffff, transparent); opacity: 0.9; transform: translate(-50%, -50%); z-index: 5; animation: trailFade 0.6s linear forwards; }
    @keyframes trailFade { 0% { opacity: 0.9; transform: scale(1); } 100% { opacity: 0; transform: scale(0.2); } }
  </style>
</head>

<body>
  <div class="frame">
    <canvas id="particles"></canvas>
    <div class="content">
      <div class="hud-top">
        <div class="hud-pill">Slither Mod UI Hub</div>
        <div>Status: ONLINE</div>
      </div>
      <div class="center">
        <div class="logo-main">BEST SLITHER.IO MODS</div>
        <div class="headline">best slither.io mod menu for completly free.</div>
        <div id="typewriter" class="typewriter"></div>
        <p class="desc">click copy code, then launch slither.io open console and paste code to inject the BSIO Client.</p>
        <div class="btn-row">
          <button class="btn-primary" id="launchSlitherBtn">Launch Slither.io</button>
          <button class="btn-secondary" id="copyCodeBtn">Copy Code</button>
        </div>
      </div>
    </div>
  </div>

  <script id="injectScript" type="text/plain">
(function() {
    if (window.__BSIO_CLIENT__) return;
    window.__BSIO_CLIENT__ = true;

    // --- STYLING ---
    const s = document.createElement('style');
    s.textContent = `
        :root { --bsio-accent: #00e1ff; --bsio-bg: rgba(5, 10, 20, 0.98); }
        #bsio_loader { position: fixed; inset: 0; background: #000; z-index: 1000000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.8s; }
        .bsio_bar { width: 200px; height: 4px; background: #111; margin-top: 20px; position: relative; overflow: hidden; }
        .bsio_progress { position: absolute; height: 100%; width: 0%; background: var(--bsio-accent); animation: bsio_load 2s forwards; }
        @keyframes bsio_load { to { width: 100%; } }

        #bsio_trigger { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 10px 25px; background: var(--bsio-bg); border: 1px solid var(--bsio-accent); border-radius: 99px; color: white; cursor: pointer; z-index: 999998; font-family: sans-serif; box-shadow: 0 0 15px var(--bsio-accent); transition: 0.3s; }
        #bsio_trigger:hover { letter-spacing: 2px; background: var(--bsio-accent); color: #000; }

        #bsio_menu { position: fixed; top: 100px; left: 100px; width: 900px; height: 600px; background: var(--bsio-bg); border: 1px solid rgba(0, 225, 255, 0.3); border-radius: 20px; z-index: 999999; display: flex; font-family: 'Segoe UI', sans-serif; color: white; box-shadow: 0 0 50px rgba(0,0,0,0.8); overflow: hidden; opacity: 0; pointer-events: none; transition: transform 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.3s; }
        #bsio_menu.active { opacity: 1; pointer-events: auto; }
        #bsio_overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 999997; display: none; backdrop-filter: blur(5px); }

        #bsio_sidebar { width: 200px; background: rgba(0,0,0,0.3); border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; padding: 20px 0; }
        .bsio_tab { padding: 14px 25px; cursor: pointer; font-size: 13px; color: #666; transition: 0.2s; border-left: 3px solid transparent; text-transform: uppercase; letter-spacing: 1px; }
        .bsio_tab:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .tab_active { color: var(--bsio-accent); border-left-color: var(--bsio-accent); background: rgba(0,225,255,0.05); }

        #bsio_content_root { flex: 1; display: flex; flex-direction: column; }
        #bsio_header { padding: 15px 25px; background: rgba(255,255,255,0.02); display: flex; justify-content: space-between; align-items: center; cursor: move; border-bottom: 1px solid rgba(255,255,255,0.05); }
        #bsio_grid { flex: 1; padding: 25px; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; align-content: start; }
        
        .bsio_card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; cursor: pointer; font-size: 12px; transition: 0.2s; text-align: center; }
        .bsio_card:hover { border-color: var(--bsio-accent); background: rgba(0,225,255,0.05); transform: translateY(-2px); }
        .card_on { border-color: #00ff88; color: #00ff88; box-shadow: 0 0 10px rgba(0,255,136,0.1); }
        
        .rgb_anim { animation: rgb_cycle 4s linear infinite; }
        @keyframes rgb_cycle { 0% { color: #ff0000; border-color: #ff0000; } 33% { color: #00ff00; border-color: #00ff00; } 66% { color: #0000ff; border-color: #0000ff; } 100% { color: #ff0000; border-color: #ff0000; } }
        .color_dot { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; display: inline-block; margin: 4px; }
    `;
    document.head.appendChild(s);

    // --- DOM SETUP ---
    const loader = document.createElement('div'); loader.id = 'bsio_loader';
    loader.innerHTML = `<h1 style="color:white; letter-spacing:10px;">BSIO CLIENT</h1><div class="bsio_bar"><div class="bsio_progress"></div></div>`;
    document.body.appendChild(loader);

    const overlay = document.createElement('div'); overlay.id = 'bsio_overlay';
    const trigger = document.createElement('div'); trigger.id = 'bsio_trigger'; trigger.innerText = 'OPEN BSIO MOD';
    const menu = document.createElement('div'); menu.id = 'bsio_menu';
    menu.innerHTML = `
        <div id="bsio_sidebar">
            <div style="padding:0 25px 20px; font-weight:900; color:white; font-size:20px;">BSIO.</div>
            <div class="bsio_tab tab_active" data-t="0">Combat</div>
            <div class="bsio_tab" data-t="1">Visuals</div>
            <div class="bsio_tab" data-t="2">Movement</div>
            <div class="bsio_tab" data-t="3">World Themes</div>
            <div class="bsio_tab" data-t="4">Snake Build</div>
            <div class="bsio_tab" data-t="5">Networking</div>
            <div class="bsio_tab" data-t="6">Social</div>
            <div class="bsio_tab" data-t="7">UI Mastery</div>
            <div class="bsio_tab" data-t="8">Automation</div>
            <div class="bsio_tab" data-t="9">Experimental</div>
        </div>
        <div id="bsio_content_root">
            <div id="bsio_header"><span>BSIO CLIENT V1.0 - ULTRA</span><span id="bsio_close" style="cursor:pointer;">✕</span></div>
            <div id="bsio_grid"></div>
        </div>
    `;
    document.body.appendChild(overlay); document.body.appendChild(trigger); document.body.appendChild(menu);

    // --- FEATURE DATA (10 TABS) ---
    const tabs = [
        ["NTL Auto-Eater", "Kill Aura (Fake)", "Target Lock", "Smart Dodge", "Circle Bot", "Fast Feed", "Mass Grabber", "Anti-Collision"],
        ["Neon Glow", "Wireframe", "See-Through", "Food ESP", "Snake ESP", "No Particles", "Leaderboard HUD", "Map HD"],
        ["Smooth Zoom", "Speed Macro", "Zoom Lock", "Reverse Steering", "Precision Mode", "Boost Lock", "Drift Mode", "Ghost Trail"],
        ["Dark Void", "Deep Ocean", "Matrix Green", "Cyber Purple", "Toxic Waste", "Mars Red", "Sky Blue", "Snow White"],
        ["Skin Rotator", "Rainbow Skin", "Invis Skin", "Giant Head", "Skin Builder", "Glow Pulsing", "Cape Toggle", "Pattern Gen"],
        ["Ping Fixer", "Packet Opt.", "Server Hopper", "IP Joiner", "Regional Sync", "Proxy Mode", "Lag Shield", "Socket Debug"],
        ["Global Chat", "Emoji Menu", "Team Finder", "Friend Track", "SOS Signal", "Stealth Mode", "Auto-Greet", "Ignore List"],
        ["Master RGB", "Glass Blur", "Neon Borders", "Custom Font", "50+ UI Colors", "HUD Scale", "Theme Importer", "Menu Sound"],
        ["Auto-Pilot", "AFK Mode", "Path Finding", "Bot Spawner", "Self-Growth", "Record Run", "Auto-Respawn", "Smart Kill"],
        ["God Mode (Vis)", "FPS Unlocker", "Dev Console", "Script Inject", "Bypass Ban", "Multi-Account", "Packet Spoof", "Hard Reset"]
    ];

    function loadTab(index) {
        const grid = document.getElementById('bsio_grid'); grid.innerHTML = '';
        if (index == 7) { // UI Mastery (Special)
            grid.innerHTML = '<div style="grid-column: span 3"><h3>50+ UI Mastery Colors</h3></div>';
            for(let i=0; i<60; i++) {
                const dot = document.createElement('div'); dot.className = 'color_dot';
                const c = `hsl(${i * 6}, 100%, 50%)`; dot.style.background = c;
                dot.onclick = () => { document.documentElement.style.setProperty('--bsio-accent', c); trigger.style.borderColor = c; trigger.style.boxShadow = `0 0 15px ${c}`; };
                grid.appendChild(dot);
            }
            const rgb = document.createElement('div'); rgb.className = 'bsio_card'; rgb.innerText = "TOGGLE MASTER RGB";
            rgb.onclick = () => menu.classList.toggle('rgb_anim');
            grid.appendChild(rgb);
            return;
        }
        tabs[index].forEach(f => {
            const c = document.createElement('div'); c.className = 'bsio_card'; c.innerText = f;
            c.onclick = () => c.classList.toggle('card_on');
            grid.appendChild(c);
        });
    }

    // --- LOGIC ---
    setTimeout(() => { loader.style.opacity = '0'; setTimeout(()=>loader.remove(), 800); }, 2000);
    trigger.onclick = () => { menu.classList.add('active'); overlay.style.display = 'block'; };
    document.getElementById('bsio_close').onclick = () => { menu.classList.remove('active'); overlay.style.display = 'none'; };
    overlay.onclick = () => document.getElementById('bsio_close').click();

    document.querySelectorAll('.bsio_tab').forEach((t, i) => t.onclick = function() {
        document.querySelectorAll('.bsio_tab').forEach(x => x.classList.remove('tab_active'));
        this.classList.add('tab_active'); loadTab(i);
    });

    // DRAG LOGIC
    let isD=false, ox, oy;
    document.getElementById('bsio_header').onmousedown = e => { isD=true; ox=e.clientX-menu.offsetLeft; oy=e.clientY-menu.offsetTop; };
    document.onmousemove = e => { if(isD) { menu.style.left=(e.clientX-ox)+'px'; menu.style.top=(e.clientY-oy)+'px'; } };
    document.onmouseup = () => isD=false;

    loadTab(0);
})();
  </script>

  <script>
    /* --- YOUR ORIGINAL WEBSITE JS - UNTOUCHED --- */
    const twText = "ready to make little timmys cry???";
    let twIndex = 0;
    function typeWriter() { document.getElementById("typewriter").textContent = twText.slice(0, twIndex++); if (twIndex <= twText.length) setTimeout(typeWriter, 45); }
    setTimeout(typeWriter, 400);

    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");
    let w, h;
    function resizeCanvas() { w = canvas.width = canvas.offsetWidth; h = canvas.height = canvas.offsetHeight; }
    resizeCanvas(); window.addEventListener("resize", resizeCanvas);

    const particles = Array.from({ length: 80 }, () => ({ x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4, r: Math.random() * 2 + 1, a: Math.random() * 0.6 + 0.2 }));
    function drawParticles() { ctx.clearRect(0, 0, w, h); ctx.fillStyle = "#00e1ff"; particles.forEach(p => { ctx.globalAlpha = p.a; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); p.x += p.vx; p.y += p.vy; if (p.x < -10) p.x = w + 10; if (p.x > w + 10) p.x = -10; if (p.y < -10) p.y = h + 10; if (p.y > h + 10) p.y = -10; }); requestAnimationFrame(drawParticles); }
    drawParticles();

    window.addEventListener("mousemove", e => { const d = document.createElement("div"); d.className = "trail-dot"; d.style.left = e.clientX + "px"; d.style.top = e.clientY + "px"; document.body.appendChild(d); setTimeout(() => d.remove(), 600); });
    document.getElementById("launchSlitherBtn").onclick = () => { window.open("https://slither.io", "_blank"); };
    document.getElementById("copyCodeBtn").onclick = () => { const scriptContent = document.getElementById("injectScript").textContent.trim(); navigator.clipboard.writeText(scriptContent).then(() => { alert("BSIO Client Copied!"); }); };
  </script>
</body>
</html>
